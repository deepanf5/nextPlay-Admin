<section class="add-movie-section">
    <form [formGroup]="addMovie">
        <div class="grid">
            <div class="col-12 md:col-6 lg:col-8">
                <div class="p-3 border-round-sm bg-white surface-card shadow-1">
                    <h4>Movie Information</h4>
                    <div class="form-group">
                        <label class="font-normal" for="movieTitle">movieTitle</label>
                        <div class="mt-3 w-full">
                            <input formControlName="movieTitle" id="movieTitle" class="w20rem" type="text" pInputText />
                        </div>
                    </div>
                    <div class="from-group mt-4">
                        <label class="font-normal" for="movieTitle">Movie Description</label>
                        <div class="mt-3 w-full">
                            <textarea rows="3" cols="23" pInputTextarea formControlName="description" id="description">
                        </textarea>
                        </div>
                    </div>
                </div>
                <div class="p-3 mt-4 border-round-sm bg-white surface-card shadow-1">
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-6">
                            <div class="form-group">
                                <label for="movieTitle">Genre</label>
                                <div class="mt-3">
                                    <p-dropdown [options]="genres" optionLabel="names" [showClear]="true"
                                        formControlName="Genre" placeholder="Select a City" />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-6">
                            <label for="language">Select a language</label>
                            <div class="mt-3">
                                <p-dropdown [options]="languages" optionLabel="lng" [showClear]="true"
                                    formControlName="language" placeholder="language" />
                            </div>
                        </div>
                    </div>
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-6">
                            <div class="form-group mt-3">
                                <label for="year">Year</label>
                                <div class="mt-3">
                                    <p-calendar formControlName="year" />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-6">
                            <div class="form-group mt-3">
                                <label for="directorName">Director Name</label>
                                <div class="mt-3">
                                    <input formControlName="directorName" id="directorName" class="w20rem" type="text"
                                        pInputText />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-4">
                            <div class="form-group mt-3">
                                <label for="moviePoster">MoviePoster URL</label>
                                <div class="mt-3">
                                    <input formControlName="moviePoster" (change)="getUrl()" id="moviePoster"
                                        class="w20rem" type="text" pInputText />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <div class="form-group mt-3">
                                <label for="trailerUrl">TrailerUrl</label>
                                <div class="mt-3">
                                    <input formControlName="trailerUrl" id="trailerUrl" class="w20rem" type="text"
                                        pInputText />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-4">
                            <div class="form-group mt-3">
                                <label for="duration">Duration</label>
                                <div class="mt-3">
                                    <input formControlName="duration" id="duration" class="w20rem" type="text"
                                        pInputText />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-12">
                            <div class="form-group mt-3">
                                <label for="videoUrl">VideoUrl</label>
                                <div class="mt-3">
                                    <input formControlName="videoUrl" id="videoUrl" class="w20rem" type="text"
                                        pInputText />
                                </div>
                            </div>
                        </div>
                        <div class="col-12 md:col-6 lg:col-12">
                            <div class="flex justify-content-between">
                                <div class="form-group mt-3">
                                    <label for="rating">Rating the movie</label>
                                    <div class="mt-3">
                                        <div class="mt-2">
                                            <p-rating formControlName="rating" [cancel]="false" />
                                        </div>
                                    </div>
                                </div>
                                <div class="pt-5">
                                    <p-button (click)="preview()" label="Preview" />
                                </div>
                                <div class="pt-5">
                                    <p-button (click)="submit()" label="Submit" />
                                </div>
                            </div>


                        </div>


                    </div>
                </div>
            </div>


            <!-- image section -->
            <div class="col-12 md:col-6 lg:col-4 border-round-sm bg-white surface-card shadow-1">
                <h2 class="capitalize">Movie poster</h2>
                <div class="text-center p-3 border-round-sm  font-bold text-center">
                    <p-image src="https://primefaces.org/cdn/primeng/images/galleria/galleria10.jpg" [preview]="true"
                        alt="Image" width="400">
                        <ng-template pTemplate="indicator">
                            <i class="pi pi-check"></i>
                        </ng-template>
                    </p-image>

                </div>
            </div>
        </div>
    </form>
</section>
