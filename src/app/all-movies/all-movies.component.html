<section class="all-movies">
    <p-table  #dt2
    [value]="movies"
    [tableStyle]="{ 'min-width': '50rem' }"
    sortMode="multiple"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['name', 'genre', 'Director', 'Rating','Year']">

    <ng-template pTemplate="caption">
        <div class="flex">
            <p-button label="Clear" [outlined]="true" icon="pi pi-filter-slash" (onClick)="clear(dt2)" />
            <span class="p-input-icon-left ml-auto">
                <i class="pi pi-search"></i>
                <input pInputText type="text" [(ngModel)]="searchValue" (input)="dt2.filterGlobal(searchValue, 'contains')" placeholder="Search keyword" />
            </span>
        </div>
    </ng-template>
   
        <ng-template pTemplate="header">
            <tr>
                <th style="width:20%">
                    Image 
                </th>
                <th pSortableColumn="name" style="width:20%">
                    Name <p-sortIcon field="name" />
                </th>
                <th pSortableColumn="genre" style="width:20%">
                    Genre <p-sortIcon field="genre" />
                </th>
                <th pSortableColumn="director" style="width:20%">
                    Director <p-sortIcon field="director" />
                </th>
                <th pSortableColumn="year" style="width:20%">
                    Year <p-sortIcon field="year" />
                </th>
                <th pSortableColumn="rating" style="width:20%">
                    Rating <p-sortIcon field="rating" />
                </th>
            </tr>
        </ng-template>
        
        <ng-template pTemplate="body" let-movie>
            <tr>
                <td>
                    <p-avatar                        
                    [image]="movie.image" 
                    size="xlarge"
                    badgeSize="xlarge" />
                </td>
                <td>{{ movie.name }}</td>
                <td>{{ movie.genre }}</td>
                <td>{{ movie.director }}</td>
                <td>{{ movie.year }}</td>
                <td><p-rating [(ngModel)]="movie.rating" stars="10" [readonly]="true" [cancel]="false"  /></td>
            </tr>
        </ng-template>
    </p-table>
</section>
